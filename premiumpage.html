<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#064FC4">
    <title>HiDook Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="./src/output.css" rel="stylesheet">
</head>

<body class="bg-white text-[#10182E]">
    <div id="navbar"></div>

    <main>
        <section class="relative isolate overflow-hidden bg-white" aria-labelledby="premium-title">
            <div class="premium-decor-red" aria-hidden="true"></div>
            <div class="premium-decor-yellow" aria-hidden="true"></div>

            <div class="relative z-10 mx-auto max-w-5xl px-5 py-14 text-center sm:px-6 sm:py-20 lg:px-8 lg:py-24">
                <h1 id="premium-title" class="mx-auto max-w-3xl text-3xl font-bold leading-tight tracking-tight text-[#064FC4] sm:text-4xl lg:text-5xl">
                    Ai o afacere listată pe HiDook?
                </h1>
                <p class="mx-auto mt-5 max-w-2xl text-base leading-7 text-[#46546A] sm:mt-6 sm:text-lg sm:leading-8">
                    Fii mai vizibil și mai aproape de clienții tăi cu HiDook Premium.
                </p>
                <a href="#" class="mt-8 inline-flex min-h-12 w-full items-center justify-center rounded-xl bg-[#064FC4] px-7 py-3 text-base font-bold text-white transition-colors hover:bg-[#124BFF] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[#064FC4] sm:mt-9 sm:w-auto">
                    Devino Premium
                </a>
            </div>
        </section>

        <section class="border-t border-[#E8E5DE] bg-[#FAF8F3] px-5 py-12 sm:px-6 sm:py-16 lg:px-8" aria-labelledby="premium-list-title">
            <div class="mx-auto max-w-5xl">
                <div class="mb-7 sm:mb-9">
                    <h2 id="premium-list-title" class="text-2xl font-bold leading-tight tracking-tight text-[#064FC4] sm:text-3xl">
                        Companii Premium
                    </h2>
                    <div class="mt-6 max-w-2xl sm:mt-7">
                        <label for="premium-search" class="mb-2 block text-sm font-semibold text-[#334E68]">Caută o companie</label>
                        <div class="relative">
                            <svg class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-[#667085]" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
                            </svg>
                            <input id="premium-search" type="search" placeholder="Caută după nume sau categorie..." autocomplete="off" class="min-h-12 w-full rounded-xl border border-[#C9D0DA] bg-white py-3 pl-12 pr-4 text-base text-[#10182E] outline-none transition-colors placeholder:text-[#667085] focus:border-[#064FC4] focus:ring-3 focus:ring-[#064FC4]/15">
                        </div>
                        <p id="premium-results-count" class="mt-3 text-sm text-[#46546A]" role="status" aria-live="polite"></p>
                    </div>
                </div>

                <div id="premium-companies" class="space-y-5 sm:space-y-6"></div>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="./src/js/components.js"></script>
    <script src="./src/js/PremiumCards.js"></script>
</body>
</html>
